name: Bug report
description: Report a reproducible problem with the public facade or consumer workflow.
labels:
  - "type: bug"
body:
  - type: input
    id: facade-revision
    attributes:
      label: Facade revision
      description: Public DocMeThis Fix commit SHA or release record identifier.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime build
      description: Private runtime build identifier only. Do not include a download token.
      placeholder: fix-build-2026-...
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, OS, architecture and Check/Verify/Extract versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Describe the workflow and provide a minimal reproduction without secrets or customer source.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Include Check summaries or Fix status. Remove secrets, prompts and source code.
      render: text
    validations:
      required: false
